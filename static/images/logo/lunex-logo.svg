<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" fill="none">
  <!-- Lunex Modern Geometric Crescent/Prism Mark -->
  <defs>
    <linearGradient id="lxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258BFA" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="lxGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A6FD4" />
      <stop offset="100%" stop-color="#7BB8FF" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Modern stylized lunar crescent & spark -->
  <g transform="translate(4, 4)">
    <circle cx="16" cy="16" r="14" fill="url(#lxGrad)" opacity="0.15" />
    <path d="M 23 7 C 14 7 8 13 8 21 C 8 26 11 29 15 31 C 11 27 12 18 18 13 C 21 11 25 10 27 11 C 26 8.5 24.5 7 23 7 Z" fill="url(#lxGrad)" />
    <circle cx="23" cy="9" r="2.5" fill="#00D2FF" />
  </g>

  <!-- Typography -->
  <text x="44" y="26" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.03em" class="brand-text-lunex" fill="currentColor">
    Lunex
  </text>
  <text x="105" y="26" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.02em" fill="#258BFA">
    Presents
  </text>
</svg>
