{% extends "base.html" %}

{% block title %}Page Not Found — Lunex Presents{% endblock %}

{% block content %}
<section style="min-height:75vh;display:flex;align-items:center;" aria-labelledby="error-404-heading">
  <div class="container text-center">
    <div style="max-width:480px;margin:0 auto;">
      <div style="font-size:7rem;font-weight:900;color:var(--lx-accent);opacity:0.15;line-height:1;letter-spacing:-0.05em;">404</div>
      <h1 class="section-title mt-n3" id="error-404-heading" style="margin-top:-1.5rem;">Page Not Found</h1>
      <p style="color:var(--lx-grey);margin-bottom:2rem;">
        The page you're looking for doesn't exist or has been moved.
      </p>
      <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="/" class="btn btn-primary" id="error-404-home-btn">
          <i class="bi bi-house me-2" aria-hidden="true"></i>Go Home
        </a>
        <a href="/work/" class="btn btn-outline-light">View Our Work</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
