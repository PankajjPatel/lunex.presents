{% load static %}
<header class="lx-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg p-0" aria-label="Lunex Presents Navigation">
      <!-- Brand Logo: Exact Original Logo -->
      <a class="navbar-brand d-inline-flex align-items-center gap-2 py-2" href="{% url 'core:home' %}" aria-label="Lunex Presents Homepage">
        <img
          src="{% static 'images/logo/lunex-logo.png' %}?v=20261107"
          alt="Lunex Presents"
          class="lx-nav-logo-img"
          style="height: 48px; width: auto; object-fit: contain; border-radius: 4px;"
          onerror="this.onerror=null; this.src='{% static 'images/logo/lunex-brand-original.png' %}';"
        >
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button
        class="navbar-toggler border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#lunexNavMenu"
        aria-controls="lunexNavMenu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Links -->
      <div class="collapse navbar-collapse" id="lunexNavMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 py-3 py-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'home' and request.resolver_match.app_name == 'core' %}active{% endif %}" href="{% url 'core:home' %}">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.app_name == 'services' %}active{% endif %}" href="{% url 'services:services' %}">
              Services
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.app_name == 'portfolio' %}active{% endif %}" href="{% url 'portfolio:work' %}">
              Portfolio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'pricing' %}active{% endif %}" href="{% url 'core:pricing' %}">
              Pricing
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'core:about' %}">
              About
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'reviews' %}active{% endif %}" href="{% url 'core:reviews' %}">
              Reviews
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-inline-flex align-items-center {% if request.resolver_match.app_name == 'audit' %}active{% endif %}" href="{% url 'audit:home' %}">
              Compliance SaaS <span class="lx-nav-badge">Tool</span>
            </a>
          </li>
          <!-- Help Option -->
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'help' and request.resolver_match.app_name == 'core' %}active{% endif %}" href="{% url 'core:help' %}">
              <i class="bi bi-question-circle me-1 text-gold"></i>Help
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'contact' and request.resolver_match.app_name == 'contact' %}active{% endif %}" href="{% url 'contact:contact' %}">
              Contact
            </a>
          </li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <a href="{% url 'contact:start_project' %}" class="btn-lunex-gold btn-sm d-inline-flex align-items-center gap-2">
              <span>Start a Project</span>
              <i class="bi bi-arrow-right"></i>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</header>
