<div class="bg-cream border-bottom border-warm py-3 mb-4">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-dark text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.08em;">
        <i class="bi bi-shield-lock-fill text-gold me-1"></i>Admin Portal
      </span>
      <span class="small text-muted">Signed in as <strong class="text-charcoal">{{ request.user.username }}</strong></span>
    </div>

    <!-- Navigation Pills -->
    <div class="d-flex flex-wrap align-items-center gap-2">
      <a href="{% url 'dashboard:home' %}" class="btn btn-sm {% if request.resolver_match.url_name == 'home' %}btn-dark{% else %}btn-outline-secondary{% endif %}" style="font-size: 0.8rem;">
        <i class="bi bi-grid-fill me-1"></i>Overview
      </a>
      <a href="{% url 'dashboard:enquiries' %}" class="btn btn-sm {% if request.resolver_match.url_name in 'enquiries,enquiry_detail' %}btn-dark{% else %}btn-outline-secondary{% endif %}" style="font-size: 0.8rem;">
        <i class="bi bi-inbox-fill me-1"></i>Enquiries
        {% if unread_count and unread_count > 0 %}
        <span class="badge bg-danger ms-1">{{ unread_count }}</span>
        {% endif %}
      </a>
      <a href="{% url 'dashboard:reviews' %}" class="btn btn-sm {% if request.resolver_match.url_name == 'reviews' %}btn-dark{% else %}btn-outline-secondary{% endif %}" style="font-size: 0.8rem;">
        <i class="bi bi-star-fill text-gold me-1"></i>Reviews
        {% if pending_count and pending_count > 0 %}
        <span class="badge bg-warning text-dark ms-1">{{ pending_count }}</span>
        {% endif %}
      </a>
      <a href="{% url 'dashboard:portfolio' %}" class="btn btn-sm {% if 'portfolio' in request.resolver_match.url_name %}btn-dark{% else %}btn-outline-secondary{% endif %}" style="font-size: 0.8rem;">
        <i class="bi bi-folder-fill me-1"></i>Portfolio
      </a>
      <a href="{% url 'dashboard:services' %}" class="btn btn-sm {% if request.resolver_match.url_name == 'services' %}btn-dark{% else %}btn-outline-secondary{% endif %}" style="font-size: 0.8rem;">
        <i class="bi bi-gear-fill me-1"></i>Services
      </a>
      <a href="{% url 'audit:dashboard' %}" class="btn btn-sm btn-outline-secondary" style="font-size: 0.8rem;">
        <i class="bi bi-shield-check text-gold me-1"></i>AuditFlow
      </a>
      <a href="/admin/" target="_blank" class="btn btn-sm btn-outline-dark" style="font-size: 0.8rem;" title="Open Django Advanced Admin">
        <i class="bi bi-box-arrow-up-right me-1"></i>Django Admin
      </a>
      <a href="{% url 'dashboard:logout' %}" class="btn btn-sm btn-outline-danger" style="font-size: 0.8rem;">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </a>
    </div>
  </div>
</div>
